<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosaic – a diary for the music you play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3f0;--surface:#fffefc;--ink:#2b2930;--mute:#6e6a72;--line:#e3dfda;--accent:#34323a;--accent-ink:#fff;--pop:#ff4f9f;--pop-ink:#2a0a1c;--star:#f08a1d;--bad:#c9524d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a1f;--surface:#25242a;--ink:#f4f1ee;--mute:#aaa5ad;--line:#37353d;--accent:#ebe6e0;--accent-ink:#1b1a1f;--pop:#ff63ad;--pop-ink:#2a0a1c;--bad:#e8837d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a1f;--surface:#25242a;--ink:#f4f1ee;--mute:#aaa5ad;--line:#37353d;--accent:#ebe6e0;--accent-ink:#1b1a1f;--pop:#ff63ad;--pop-ink:#2a0a1c;--bad:#e8837d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 14px/1.5 "Montserrat",system-ui,sans-serif}
h1,h2,h3{font-family:"Montserrat",system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
.wrap{max-width:800px;margin:0 auto;padding:14px 14px 48px}
/* tactile controls: raised edge that presses in */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:7px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 rgba(0,0,0,.35);
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 color-mix(in srgb,var(--accent) 55%,#000);
transition:transform .08s,box-shadow .08s,filter .12s}
.btn:hover{filter:brightness(1.07)}
.btn.pop{background:var(--pop);color:var(--pop-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 color-mix(in srgb,var(--pop) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 transparent}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 var(--line)}
.btn.ghost:active{box-shadow:inset 0 1px 2px rgba(0,0,0,.2),0 0 0 transparent}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:6px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
label{display:block;font-weight:400;font-size:13px;margin:10px 0 3px}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:48px;max-width:860px;margin:0 auto;padding:72px 16px 32px}
.brand{position:absolute;top:18px;left:20px;font:600 21px/1 "Montserrat",sans-serif;letter-spacing:-.02em}
.auth h1{font-size:clamp(28px,4vw,42px);font-weight:600;letter-spacing:-.02em}
.auth p{color:var(--mute);max-width:34ch;margin:10px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.14)}
.full{width:100%}.pwbox{position:relative}.pwbox input{padding-right:40px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:5px;border-radius:6px;color:var(--mute);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:grid}.eye.on{color:var(--pop)}
input.bad{color:var(--bad);border-color:var(--bad)}.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0 0}
@media (max-width:760px){.auth{grid-template-columns:1fr;gap:12px}}
/* app */
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
header.top h2{font:600 21px/1 "Montserrat",sans-serif;letter-spacing:-.02em;margin-right:10px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 2px;margin:0 6px;font-size:14px;font-weight:500;color:var(--mute);cursor:pointer}
nav button[aria-current="true"]{color:var(--ink);border-color:var(--pop)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;background:var(--line)}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.big{width:64px;height:64px}
.sw{display:flex;align-items:center;gap:6px}
.sw{position:relative}
.sug{position:absolute;left:0;top:100%;padding-top:6px;width:min(340px,92vw);z-index:40}
.sug[hidden]{display:none}
.sug .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.sg{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:none;border:0;border-radius:6px;padding:5px 6px;cursor:pointer}
.sg.on,.sg:hover{background:var(--line)}
.sg span{min-width:0}
.sg b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg.all{justify-content:center;color:var(--mute);font-size:13px}
.sw input{width:0;padding:7px 0;border:0;box-shadow:none;opacity:0;transition:width .15s,opacity .15s}
.sw:hover input,.sw:focus-within input{width:min(200px,38vw);padding:7px 10px;border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.14);opacity:1;visibility:visible}
.top .right{display:flex;align-items:center;gap:6px;margin-left:auto}
.me,.ib{background:var(--surface);border:1px solid var(--line);border-radius:7px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
.me:active,.ib:active{transform:translateY(2px);box-shadow:inset 0 1px 2px rgba(0,0,0,.2),0 0 0 transparent}
.me{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;font-size:14px;font-weight:500}
.me[aria-current="true"],.ib[aria-expanded="true"]{border-color:var(--pop)}
.me .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:36px;height:36px;display:grid;place-items:center}
.ibw{position:relative}
.pop{position:absolute;right:0;top:44px;width:min(260px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;z-index:20;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.pop[hidden]{display:none}
.pop h3{font-size:15px;font-weight:500;margin-bottom:4px}
.prof{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;flex-wrap:wrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 14px rgba(0,0,0,.1)}
.prof h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.mew{position:relative}
.menu{display:none;position:absolute;right:0;top:100%;padding-top:6px;z-index:30;min-width:210px}
.menu .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;font-size:14px;font-weight:400;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--line)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.mew:hover .menu,.mew:focus-within .menu,.mew.open .menu{display:block}
.mew.shut .menu{display:none}
.page h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
.page dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.page dt{color:var(--mute)}.page dd{margin:0;font-weight:400}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools select{flex:0 1 130px}
.list{display:grid;gap:10px}
.rev{display:grid;grid-template-columns:72px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 10px rgba(0,0,0,.1)}
.cover{width:72px;aspect-ratio:1;border-radius:6px;display:grid;place-items:end start;padding:6px;color:#fff;font:600 11px/1.1 "Montserrat",sans-serif;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.25)}
.rev h3{font-size:17px;font-weight:600}
.meta{color:var(--mute);font-size:13px}
.stars{color:var(--star);letter-spacing:1px;font-size:15px}
.rev p{margin:6px 0 0}
.rev .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:28px 10px;border:1px dashed var(--line);border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate{display:flex;gap:2px}
.rate button{background:none;border:0;font-size:26px;cursor:pointer;color:var(--line);padding:0;transition:transform .08s}
.rate button:active{transform:scale(.85)}
.rate button.on{color:var(--star)}
dialog{border:0;border-radius:10px;padding:18px;width:min(640px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,12,20,.55)}
@media (max-width:520px){.rev{grid-template-columns:60px 1fr}.cover{width:60px;font-size:10px}.two{grid-template-columns:1fr}}
.cover{position:relative}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pick{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.pick .cover{width:44px;flex:none;font-size:8px;padding:3px}
.results{display:grid;gap:2px;margin-top:6px;max-height:230px;overflow:auto}
.res{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:none;border:1px solid transparent;border-radius:6px;padding:4px 6px;cursor:pointer}
.res:hover,.res:focus-visible{background:var(--line)}
.res b{display:block;font-weight:500;font-size:14px}
.rart{width:40px;height:40px;border-radius:5px;flex:none;background:var(--line);object-fit:cover}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px}
.ulink{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;cursor:pointer}
.ulink:hover{color:var(--pop)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--pop)}
.ib{position:relative}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 2px var(--surface)}
.note{padding:6px 0;font-size:13px;border-top:1px solid var(--line)}
.note:first-of-type{border-top:0}
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.stab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;margin-bottom:-1px;font-size:14px;font-weight:500;color:var(--mute);cursor:pointer}
.stab[aria-selected="true"]{color:var(--ink);border-color:var(--pop)}
.ri{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ri .rt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.ri .rt b{display:block;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .rt .meta{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .rart{width:48px;height:48px;border-radius:6px;flex:none;object-fit:cover;background:var(--line)}

/* bigger art */
.rev{grid-template-columns:140px 1fr}.rev .cover{width:140px;font-size:13px}
.pick .cover{width:76px;font-size:10px;padding:5px}
.rart{width:56px;height:56px}
.tile{display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px;border-radius:6px;text-shadow:0 1px 3px rgba(0,0,0,.4)}.demo{grid-column:1/-1;margin:0 0 4px}
.ri .rart{width:76px;height:76px}.ri{padding:10px}
.sg .rart{width:48px;height:48px}
@media (max-width:520px){.rev{grid-template-columns:96px 1fr}.rev .cover{width:96px;font-size:11px}.ri .rart{width:64px;height:64px}}
/* fractional stars + stepper */
.stars{background:linear-gradient(90deg,var(--star) var(--p,0%),color-mix(in srgb,var(--mute) 35%,transparent) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-size:17px}
.rv{font-weight:600;font-size:14px}
.rate{align-items:center}
.rate>button[data-r]{background:linear-gradient(90deg,var(--star) var(--p,0%),color-mix(in srgb,var(--mute) 35%,transparent) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.rate .step{display:inline-flex;flex-direction:column;gap:2px;margin:0 10px 0 8px}
.rate .step button{font-size:9px;line-height:1;width:26px;height:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 var(--line)}
.rate .step button:hover{border-color:var(--pop)}
.rate .step{gap:0;margin:0 8px 0 6px}
.rate .step button{width:22px;height:14px;border:0;border-radius:4px;background:none;box-shadow:none;padding:0;display:grid;place-items:center;color:var(--mute);font-size:0}
.rate .step button:hover{color:var(--pop);background:color-mix(in srgb,var(--pop) 12%,transparent)}
.rate .step button:active{transform:none;color:var(--pop)}
.rval{font-size:22px;font-weight:600;min-width:2.4ch}
/* colour */
:root{--teal:#1fb5a3;--violet:#8b6cff;--sun:#ffb43a}
body{background:radial-gradient(900px 520px at 6% -8%,color-mix(in srgb,var(--pop) 15%,transparent),transparent 62%),radial-gradient(800px 520px at 100% 0%,color-mix(in srgb,var(--violet) 15%,transparent),transparent 62%),radial-gradient(800px 520px at 50% 115%,color-mix(in srgb,var(--teal) 13%,transparent),transparent 62%),var(--bg);background-attachment:fixed}
header.top .wm,.brand{background:linear-gradient(90deg,var(--pop),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
nav button[aria-current="true"]{border-image:linear-gradient(90deg,var(--pop),var(--violet)) 1}
.btn:not(.ghost):not(.pop){background:linear-gradient(135deg,#7a5cf5,#c04fd8);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #4b3aa8}
.btn:not(.ghost):not(.pop):active{box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 transparent}
.rev{border-left:4px solid hsl(var(--h,300) 70% 55%)}
.tag.sng{color:var(--teal);border-color:var(--teal)}.tag.alb{color:var(--violet);border-color:var(--violet)}
.prof,.auth .card{position:relative;overflow:hidden}
.prof::before,.auth .card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--pop),var(--violet),var(--teal))}
.stab[aria-selected="true"]{border-color:var(--teal)}
.chip{border-color:color-mix(in srgb,var(--violet) 45%,var(--line))}
.empty{border-color:color-mix(in srgb,var(--violet) 40%,var(--line))}

/* profile boxes: no coloured lining */
.rev{border-left:1px solid var(--line)}
.prof::before{display:none}
.wm{background:linear-gradient(90deg,var(--pop),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;border:0;padding:0;font:inherit;letter-spacing:inherit;cursor:pointer}
header.top h2{margin-right:10px}
.ri.click{cursor:pointer;transition:border-color .12s,transform .08s}
.ri.click:hover{border-color:var(--pop)}.ri.click:active{transform:translateY(1px)}
/* review layout: art left, text right */
.rvh{grid-column:1/-1}
.rvgrid.split{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:12px 24px;align-items:start}
.pickbig .cover{width:100%;max-width:240px;font-size:16px;padding:10px}
.pickbig b{display:block;margin-top:10px;font-size:16px;font-weight:600}
.pickbig .btn{margin-top:8px}
.rvgrid.split textarea{min-height:180px}
.page>.card,#rvhost{max-width:900px}
@media (max-width:600px){.rvgrid.split{display:block}.pickbig{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.pickbig .cover{width:96px}.pickbig b{margin-top:0}}

/* review actions */
.rev .meta.via{margin-bottom:2px}
.acts{display:flex;gap:4px;margin:8px 0 0 -6px;align-items:center}
.act{display:inline-flex;align-items:center;gap:5px;background:none;border:0;border-radius:7px;padding:5px 8px;color:var(--mute);cursor:pointer;font-size:13px;font-weight:400;transition:color .12s,background .12s,transform .08s}
.act:hover:not(:disabled){color:var(--ink);background:var(--line)}
.act:active:not(:disabled){transform:scale(.92)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.on{color:var(--pop)}
.act[data-rp].on{color:var(--teal)}
.act[data-like].on svg{fill:currentColor}
.cmts{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}
.cm{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cm .cx{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.cm .cx:hover{color:var(--bad)}
.cmf{display:flex;gap:6px;margin-top:2px}.cmf input{flex:1;min-width:0}

/* send tray */
.sendw{position:relative;display:inline-flex}
.tray{position:absolute;left:100%;top:50%;margin-left:6px;transform:translate(-6px,-50%);display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility 0s .18s;z-index:6;white-space:nowrap}
.tray::before{content:"";position:absolute;left:-10px;top:0;bottom:0;width:10px}
.sendw.open .tray{opacity:1;visibility:visible;transform:translate(0,-50%);transition-delay:0s}
.avs{position:relative;display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;color:var(--mute);transition:transform .1s}
.avs:hover,.avs:focus-visible{transform:translateY(-2px)}
.avs .av{width:30px;height:30px}
.avs.lnk{border:1px solid var(--line);background:var(--surface)}
.avs.lnk:hover{color:var(--pop);border-color:var(--pop)}
.avs::after{content:attr(data-name);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,3px);background:var(--ink);color:var(--bg);font-size:12px;font-weight:400;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;white-space:nowrap}
.avs:hover::after,.avs:focus-visible::after,.avs.flash::after{opacity:1;transform:translate(-50%,0)}
.avs .ok{display:none;position:absolute;inset:0;border-radius:50%;background:color-mix(in srgb,var(--teal) 88%,transparent);color:#fff;font-style:normal;font-size:14px;place-items:center}
.avs.sent .ok{display:grid}
.tnone{font-size:12px;padding:0 4px}
@media (max-width:520px){.tray .avs:nth-child(n+7){display:none}}

.fol-on{min-width:96px}.fol-on .fb{display:none}
.fol-on:hover .fa,.fol-on:focus-visible .fa{display:none}.fol-on:hover .fb,.fol-on:focus-visible .fb{display:inline}
.fol-on:hover{color:var(--bad);border-color:var(--bad)}
.row2 .btn{min-width:110px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){

$("#rf",d).addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.tagName==="INPUT")e.preventDefault()});
renderSel();
function paint(fid){var h="";for(var i=1;i<=5;i++){var f=Math.max(0,Math.min(1,rating-(i-1)));h+='<button type="button" data-r="'+i+'" style="--p:'+Math.round(f*100)+'%" aria-label="'+i+' star'+(i>1?"s":"")+'">★</button>'}
h+='<span class="step"><button type="button" id="rup" aria-label="Raise rating by 0.1"><svg width="10" height="7" viewBox="0 0 10 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 5.5 5 1.5l4 4"/></svg></button><button type="button" id="rdn" aria-label="Lower rating by 0.1"><svg width="10" height="7" viewBox="0 0 10 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1.5 5 5.5l4-4"/></svg></button></span><b class="rval" aria-live="polite">'+rating.toFixed(1)+'</b>';
$(".rate",d).innerHTML=h;d.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(e){var i=+b.dataset.r,bx=b.getBoundingClientRect();rating=(e.detail>0&&bx.width&&e.clientX-bx.left<bx.width/2)?i-0.5:i;paint()}});
$("#rup",d).onclick=function(){rating=rnum(rating+0.1);paint("rup")};$("#rdn",d).onclick=function(){rating=rnum(rating-0.1);paint("rdn")};
if(fid)$("#"+fid,d).focus()}
paint();

if(chosen){o={title:chosen.title,artist:chosen.artist,type:chosen.type||"Song",art:chosen.art,tid:chosen.tid}}
else if(manual){var t=$("#ti",d).value.trim(),a=$("#ar",d).value.trim();if(!t||!a){err("Add a title and an artist.");return}o={title:t,artist:a,type:$("#ty",d).value,art:"",tid:null}}
else{err("Search for a song and choose it, or enter it yourself.");return}
if(!(rating>0)){err("Choose a star rating.");return}
o.rating=rating;o.text=$("#tx",d).value.trim();
var svb=$("#sv",d);svb.disabled=true;
api.saveReview(o,r).then(function(res){if(res&&res.error){svb.disabled=false;err(res.error);return}if(host){S.tab="profile";appView()}else{d.close();appView()}}).catch(function(){svb.disabled=false;err("Couldn't save. Check your connection and try again.")})};
if(!host)d.showModal()}

var localApi={
async start(){S.user=store.get("ln_user",null);return !!S.user},
async usernameTaken(n){var low=n.toLowerCase();return accts.some(function(x){return x.name.toLowerCase()===low})||S.reviews.some(function(r){return r.user.toLowerCase()===low})},
async signUp(dn,em,pw){
if(accts.some(function(x){return x.email===em}))return {error:"That email already has an account. Sign in instead."};
if(await localApi.usernameTaken(dn))return {error:"That username is taken. Try another.",field:"dn"};
var salt=String(Math.random()).slice(2)+Date.now(),h=await hash(pw,salt);
accts.push({email:em,name:dn,salt:salt,hash:h,created:new Date().toISOString()});store.set("ln_accounts",accts);S.user=dn;store.set("ln_user",dn);return {}},
async signIn(idf,pw){var a=accts.filter(function(x){return x.email===idf||x.name.toLowerCase()===idf})[0];
if(!a||(await hash(pw,a.salt))!==a.hash)return {error:"Username, email or password is incorrect."};
S.user=a.name;store.set("ln_user",a.name);return {}},
async signOut(){S.user=null;store.set("ln_user",null)},
async saveReview(o,r){if(r){Object.assign(r,o)}else{S.reviews.push(Object.assign({id:Date.now(),user:S.user,date:new Date().toISOString().slice(0,10)},o))}save();return {}},
async delReview(id){S.reviews=S.reviews.filter(function(r){return r.id!=id});save()},
async setPic(url){var ac=me();if(ac){if(url)ac.pic=url;else delete ac.pic;store.set("ln_accounts",accts)}},
async toggleFol(n){toggleFol(n)},
async markRead(){store.set("ln_accounts",accts)},
async sendReview(rid,to){var t=acct(to);if(!t)return {error:"x"};t.msgs=(t.msgs||[]).filter(function(m){return !(m.by===S.user&&String(m.rid)===String(rid))});t.msgs.unshift({id:Date.now(),by:S.user,rid:rid,date:new Date().toISOString().slice(0,10),read:false});t.msgs=t.msgs.slice(0,30);store.set("ln_accounts",accts);return {}},
async markMsgsRead(){store.set("ln_accounts",accts)},
async persistToggle(kind,rid,add){saveSoc();if(add)notifyLocal(kind==="likes"?"like":"repost",rid)},
async addComment(rid,text){var a=S.comments[rid]=S.comments[rid]||[];a.push({id:Date.now(),user:S.user,text:text,date:new Date().toISOString().slice(0,10)});saveSoc();notifyLocal("comment",rid)},
async delComment(cid,rid){S.comments[rid]=(S.comments[rid]||[]).filter(function(c){return String(c.id)!==String(cid)||c.user!==S.user});saveSoc()}
};
function notifyLocal(kind,rid){var r=S.reviews.filter(function(x){return String(x.id)===String(rid)})[0];if(!r||r.user===S.user)return;var o=acct(r.user);if(!o)return;o.notes=(o.notes||[]).filter(function(n){return kind==="comment"||!(n.by===S.user&&n.kind===kind&&String(n.rid)===String(rid))});o.notes.unshift({by:S.user,date:new Date().toISOString().slice(0,10),read:false,kind:kind,rid:rid});o.notes=o.notes.slice(0,30);store.set("ln_accounts",accts)}
async function loadRemote(){
var rs=await Promise.all([sb.from("profiles").select("id,username,pic,created_at"),sb.from("reviews").select("*").order("created_at",{ascending:false}),sb.from("follows").select("follower,following"),sb.from("notifications").select("id,actor_id,read,created_at").order("created_at",{ascending:false}).limit(30)]);
for(var i=0;i<rs.length;i++)if(rs[i].error)throw rs[i].error;
var by={};
accts=(rs[0].data||[]).map(function(x){var o={id:x.id,name:x.username,created:x.created_at,following:[]};if(okPic(x.pic))o.pic=x.pic;by[x.id]=o;return o});
(rs[2].data||[]).forEach(function(f){if(by[f.follower]&&by[f.following])by[f.follower].following.push(by[f.following].name)});
S.reviews=(rs[1].data||[]).map(function(x){return {id:x.id,title:x.title,artist:x.artist,type:x.type,art:x.art||"",tid:x.tid,rating:rnum(x.rating),text:x.body||"",user:by[x.user_id]?by[x.user_id].name:"Unknown",date:String(x.created_at).slice(0,10)}});
var m=by[S.uid];S.user=m?m.name:null;
if(m){m.email=S.email;m.notes=(rs[3].data||[]).map(function(n){return {id:n.id,by:by[n.actor_id]?by[n.actor_id].name:"Someone",date:String(n.created_at).slice(0,10),read:n.read}})}
S.msgOK=false;
try{var mr=await sb.from("messages").select("id,sender,review_id,read,created_at").eq("recipient",S.uid).order("created_at",{ascending:false}).limit(30);
if(!mr.error){S.msgOK=true;if(m)m.msgs=(mr.data||[]).map(function(x){return {id:x.id,by:by[x.sender]?by[x.sender].name:"Someone",rid:x.review_id,date:String(x.created_at).slice(0,10),read:x.read}})}}catch(e){S.msgOK=false}
S.social=false;S.likes={};S.reposts={};S.comments={};
try{var sr=await Promise.all([sb.from("review_likes").select("review_id,user_id"),sb.from("review_reposts").select("review_id,user_id"),sb.from("review_comments").select("id,review_id,user_id,body,created_at").order("created_at",{ascending:true}),sb.from("notifications").select("id,kind,review_id")]);
if(!sr[0].error&&!sr[1].error&&!sr[2].error){S.social=true;
(sr[0].data||[]).forEach(function(x){if(by[x.user_id])(S.likes[x.review_id]=S.likes[x.review_id]||[]).push(by[x.user_id].name)});
(sr[1].data||[]).forEach(function(x){if(by[x.user_id])(S.reposts[x.review_id]=S.reposts[x.review_id]||[]).push(by[x.user_id].name)});
(sr[2].data||[]).forEach(function(x){if(by[x.user_id])(S.comments[x.review_id]=S.comments[x.review_id]||[]).push({id:x.id,user:by[x.user_id].name,text:x.body,date:String(x.created_at).slice(0,10)})});
if(m&&!sr[3].error){var km={};(sr[3].data||[]).forEach(function(x){km[x.id]=x});m.notes.forEach(function(n){var x=km[n.id];if(x&&x.kind&&x.kind!=="follow"){n.kind=x.kind;n.rid=x.review_id}})}}}catch(e){S.social=false}}
var remoteApi={
async start(){var x=await sb.auth.getSession(),ss=x.data&&x.data.session;if(!ss)return false;
S.uid=ss.user.id;S.email=ss.user.email;await loadRemote();if(!S.user){await sb.auth.signOut();return false}return true},
async signUp(dn,em,pw){
var t=await sb.rpc("username_available",{n:dn});if(t.data===false)return {error:"That username is taken. Try another.",field:"dn"};
var r=await sb.auth.signUp({email:em,password:pw,options:{data:{username:dn}}});
if(r.error){var m=r.error.message||"";
if(/already registered/i.test(m))return {error:"That email already has an account. Sign in instead."};
if(/database error/i.test(m))return {error:"That username is taken. Try another.",field:"dn"};
return {error:m}}
if(!r.data.session)return {error:"Check your email to confirm your account, then sign in."};
S.uid=r.data.user.id;S.email=em;await loadRemote();return S.user?{}:{error:"Your account was created, but loading it failed. Refresh the page."}},
async signIn(idf,pw){var email=idf;
if(idf.indexOf("@")<0){var x=await sb.rpc("email_for_username",{u:idf});if(!x.data)return {error:"Username, email or password is incorrect."};email=x.data}
var r=await sb.auth.signInWithPassword({email:email,password:pw});
if(r.error){return {error:/not confirmed/i.test(r.error.message||"")?"Confirm your email first, then sign in.":"Username, email or password is incorrect."}}
S.uid=r.data.user.id;S.email=r.data.user.email;await loadRemote();return S.user?{}:{error:"Couldn't load your account. Refresh the page."}},
async signOut(){await sb.auth.signOut();S.user=null;S.uid=null;accts=[];S.reviews=[]},
async saveReview(o,r){var row={title:o.title,artist:o.artist,type:o.type,art:o.art||null,tid:o.tid||null,rating:o.rating,body:o.text};
var res=r?await sb.from("reviews").update(row).eq("id",r.id):await sb.from("reviews").insert(row);
if(res.error)return {error:"Couldn't save: "+res.error.message};await loadRemote();return {}},
async delReview(id){await sb.from("reviews").delete().eq("id",id);await loadRemote()},
async setPic(url){await sb.from("profiles").update({pic:url||null}).eq("id",S.uid);await loadRemote()},
async toggleFol(n){var t=acct(n);if(!t||!S.uid)return;
if(isFol(n)){await sb.from("follows").delete().eq("follower",S.uid).eq("following",t.id)}else{await sb.from("follows").insert({following:t.id})}
await loadRemote()},
async markRead(){await sb.from("notifications").update({read:true}).eq("read",false)},
async sendReview(rid,to){var t=acct(to);if(!t||!S.uid)return {error:"x"};var r=await sb.from("messages").insert({recipient:t.id,review_id:rid});return r.error?{error:r.error.message}:{}},
async markMsgsRead(){await sb.from("messages").update({read:true}).eq("read",false)},
async persistToggle(kind,rid,add){if(!S.uid)return;var tb=kind==="likes"?"review_likes":"review_reposts";
if(add)await sb.from(tb).insert({review_id:rid});else await sb.from(tb).delete().eq("review_id",rid).eq("user_id",S.uid);await loadRemote()},
async addComment(rid,text){var r=await sb.from("review_comments").insert({review_id:rid,body:text});await loadRemote();return r.error?{error:r.error.message}:{}},
async delComment(cid,rid){await sb.from("review_comments").delete().eq("id",cid);await loadRemote()}
};
var api=REMOTE?remoteApi:localApi;
if(REMOTE)$("#app").innerHTML='<p class="meta" style="padding:24px">Loading…</p>';
api.start().then(function(ok){if(ok)appView();else authView()}).catch(function(){$("#app").innerHTML='<p class="meta" style="padding:24px">Couldn\'t connect to the database. Refresh the page to try again.</p>'});
})();
</script>
