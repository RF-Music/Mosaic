<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosaic – a diary for the music you play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3f0;--surface:#fffefc;--ink:#2b2930;--mute:#6e6a72;--line:#e3dfda;--accent:#34323a;--accent-ink:#fff;--pop:#ff4f9f;--pop-ink:#2a0a1c;--star:#f08a1d;--bad:#c9524d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a1f;--surface:#25242a;--ink:#f4f1ee;--mute:#aaa5ad;--line:#37353d;--accent:#ebe6e0;--accent-ink:#1b1a1f;--pop:#ff63ad;--pop-ink:#2a0a1c;--bad:#e8837d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a1f;--surface:#25242a;--ink:#f4f1ee;--mute:#aaa5ad;--line:#37353d;--accent:#ebe6e0;--accent-ink:#1b1a1f;--pop:#ff63ad;--pop-ink:#2a0a1c;--bad:#e8837d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 14px/1.5 "Montserrat",system-ui,sans-serif}
h1,h2,h3{font-family:"Montserrat",system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
.wrap{max-width:800px;margin:0 auto;padding:14px 14px 48px}
/* tactile controls: raised edge that presses in */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:7px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 rgba(0,0,0,.35);
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 color-mix(in srgb,var(--accent) 55%,#000);
transition:transform .08s,box-shadow .08s,filter .12s}
.btn:hover{filter:brightness(1.07)}
.btn.pop{background:var(--pop);color:var(--pop-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 color-mix(in srgb,var(--pop) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 transparent}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 var(--line)}
.btn.ghost:active{box-shadow:inset 0 1px 2px rgba(0,0,0,.2),0 0 0 transparent}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:6px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
label{display:block;font-weight:400;font-size:13px;margin:10px 0 3px}
/* auth */
/* sign-in headline: three lines stepping down and to the right, each starting where the one above ends (--a, --b), falling faster as it goes (--p1, --p2). The stair sits high on the page; the sign-in box sits beside it on the right, centred vertically, its middle on the 75% line */
.auth{--k:25.8;--fs:clamp(20px,calc((50vw - 64px)/var(--k)),32px);position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:100%;grid-template-rows:minmax(100vh,auto);padding:0}
.auth section{grid-area:1/1;align-self:start;display:flex;justify-content:flex-end;width:calc(50vw - 24px);min-width:0;padding-top:max(64px,11vh)}
.auth h1{--a:8.874em;--b:20.035em;--p1:2.6em;--p2:5em;flex:none;font-family:"Sekuya","Montserrat",system-ui,sans-serif;font-weight:400;font-size:var(--fs);line-height:1.1;letter-spacing:0;font-synthesis:none;text-align:left}
.auth h1 span{display:block;white-space:nowrap}
.auth h1 span:nth-child(2){margin-top:calc(var(--p1) - 1.1em);margin-left:var(--a)}
.auth h1 span:nth-child(3){margin-top:calc(var(--p2) - 1.1em);margin-left:var(--b)}
.auth h1 span:only-child{margin-top:calc(var(--p1) + var(--p2))}
@media (max-width:760px){.auth h1 span:only-child{margin-top:0}}
.auth .card{width:390px;max-width:calc(100% - 32px);grid-area:1/1;justify-self:center;align-self:center;margin:32px 16px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.auth .brand{z-index:2}
.auth .brand::before{content:"";position:absolute;inset:-9px -13px;border-radius:10px;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:-1}
.brand{position:absolute;top:18px;left:20px;font:600 21px/1 "Montserrat",sans-serif;letter-spacing:-.02em}

.auth p{color:var(--mute);max-width:34ch;margin:10px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.14)}
.full{width:100%}.pwbox{position:relative}.pwbox input{padding-right:40px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:5px;border-radius:6px;color:var(--mute);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:grid}.eye.on{color:var(--pop)}
input.bad{color:var(--bad);border-color:var(--bad)}.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0 0}
@media (max-width:1279px){.auth{--k:15.3}.auth h1{--a:4em;--b:9em}}
@media (max-width:760px){.auth{grid-template-rows:auto auto;align-content:center;gap:12px;padding:72px 16px 32px}.auth section{grid-area:auto;align-self:auto;width:auto;justify-content:flex-start;padding:0 0 16px}.auth h1{--p1:2.2em;--p2:3.8em;font-size:clamp(17px,calc((100vw - 32px)/var(--k)),34px)}.auth .card{width:auto;max-width:none;grid-area:auto;justify-self:stretch;align-self:auto;margin:0}}
/* app */
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
header.top h2{font:600 21px/1 "Montserrat",sans-serif;letter-spacing:-.02em;margin-right:10px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 2px;margin:0 6px;font-size:14px;font-weight:500;color:var(--mute);cursor:pointer}
nav button[aria-current="true"]{color:var(--ink);border-color:var(--pop)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;background:var(--line)}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.big{width:64px;height:64px}
.sw{display:flex;align-items:center;gap:6px}
.sw{position:relative}
.sug{position:absolute;left:0;top:100%;padding-top:6px;width:min(340px,92vw);z-index:40}
.sug[hidden]{display:none}
.sug .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.sg{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:none;border:0;border-radius:6px;padding:5px 6px;cursor:pointer}
.sg.on,.sg:hover{background:var(--line)}
.sg span{min-width:0}
.sg b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg.all{justify-content:center;color:var(--mute);font-size:13px}
.sug .rh,.mrec .rh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px;font-size:12px;color:var(--mute)}
.rclr{background:none;border:0;padding:0;font:inherit;color:var(--mute);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.rclr:hover{color:var(--ink)}
.sg.rq{padding:7px 6px;font-size:14px;color:var(--ink)}
.sg.rq svg{flex:none;color:var(--mute)}
.sg.rq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg.more{justify-content:center;color:var(--mute);padding:3px 6px}
.sg.more .car{width:18px;height:18px}
.sg.more:hover{color:var(--ink)}
.sw input{width:0;height:36px;min-width:0;padding:7px 0;border:0;box-shadow:none;opacity:0;transition:width .15s,opacity .15s}
.sw:hover input,.sw:focus-within input{width:min(200px,38vw);padding:7px 10px;border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.14);opacity:1;visibility:visible}
.top .right{display:flex;align-items:center;gap:6px;margin-left:auto}
.me,.ib{background:var(--surface);border:1px solid var(--line);border-radius:7px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
.me:active,.ib:active{transform:translateY(2px);box-shadow:inset 0 1px 2px rgba(0,0,0,.2),0 0 0 transparent}
.me{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;font-size:14px;font-weight:500}
.me[aria-current="true"],.ib[aria-expanded="true"],.ib[aria-current="true"]{border-color:var(--pop)}
.me .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:36px;height:36px;display:grid;place-items:center}
.ibw{position:relative}
.pop{position:absolute;right:0;top:44px;width:min(260px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;z-index:20;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.pop[hidden]{display:none}
.pop h3{font-size:15px;font-weight:500;margin-bottom:4px}
.prof{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;flex-wrap:wrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 14px rgba(0,0,0,.1)}
.prof h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.mew{position:relative}
.menu{display:none;position:absolute;right:0;top:100%;padding-top:6px;z-index:30;min-width:210px}
.menu .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;font-size:14px;font-weight:400;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--line)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.mew:hover .menu,.mew:focus-within .menu,.mew.open .menu{display:block}
.mew.shut .menu{display:none}
.page h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
.page dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.page dt{color:var(--mute)}.page dd{margin:0;font-weight:400}
.tools{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.tl{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 0%;min-width:0}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);box-shadow:0 2px 0 var(--line)}
.seg button{display:grid;place-items:center;width:38px;height:35px;padding:0;background:var(--surface);color:var(--ink);border:0;cursor:pointer;transition:background .12s,color .12s}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover:not([aria-pressed="true"]){background:var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline-offset:-3px}
.tools select{flex:0 1 130px}.tools #s{flex-basis:156px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.rev{display:grid;grid-template-columns:72px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 10px rgba(0,0,0,.1)}
.cover{width:72px;aspect-ratio:1;border-radius:6px;display:grid;place-items:end start;padding:6px;color:#fff;font:600 11px/1.1 "Montserrat",sans-serif;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.25)}
.rev h3{font-size:17px;font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:13px}
.stars{color:var(--star);letter-spacing:1px;font-size:15px}
.rev p{margin:6px 0 0}
.rev .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--mute)}
.tag.rvd{flex:none;margin-left:auto;align-self:center;white-space:nowrap}
/* under a song's cover: the Tessellated ribbon (in your mosaic) or the small Tiled mark */
.sart{width:100%;max-width:240px}
.tessw{margin-top:10px;animation:tglow 1.8s ease .3s both}
.tess{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;height:28px;padding:0 14px;overflow:hidden;color:#fff;font:700 11px/1 "Montserrat",sans-serif;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(135deg,#7a5cf5,#c04fd8);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 50%,100% 100%,0 100%,10px 50%);box-shadow:inset 0 1px 0 rgba(255,222,150,.65),inset 0 -1px 0 rgba(255,222,150,.45)}
.tess svg{flex:none;width:12px;height:12px}
.tess::after{content:"";position:absolute;top:-60%;bottom:-60%;left:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,214,110,.18) 20%,rgba(255,226,150,.95) 46%,#fffbe8 50%,rgba(255,226,150,.95) 54%,rgba(255,214,110,.18) 80%,transparent);transform:translateX(-160%) skewX(-24deg);animation:tshine 1.3s cubic-bezier(.35,.1,.25,1) .45s both;pointer-events:none}
@keyframes tshine{to{transform:translateX(420%) skewX(-24deg)}}
@keyframes tglow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,196,80,0))}45%{filter:drop-shadow(0 0 10px rgba(255,196,80,.8))}}
.tiled{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:12.5px;font-weight:500;color:var(--mute)}
.tiled i{flex:none;width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,#7a5cf5,#c04fd8)}
/* not tiled yet: the same mark, gone flat, grey and a bit glum */
.tiled.not{opacity:.75}.tiled.not i{background:linear-gradient(160deg,#6a6a72,#45454c);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
/* both marks flip: a quick snap every 1.5 seconds, round each way in turn (right, down, left, up) */
.tiled i{animation:tflip 6s cubic-bezier(.35,1.35,.5,1) infinite}

.rar.ra{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:7px}.rar .ran{min-width:0;overflow-wrap:anywhere}
.albg{display:inline-flex;align-items:center;white-space:nowrap}.rar .albg .tag{margin-left:0}

.rev:not(.nocv) .rch{grid-row:1;align-self:start;min-width:0}

.rev:not(.nocv) .rcf{grid-row:3;align-self:end;min-width:0}

/* three per row: the review is the centrepiece */
.cols3 .rev:not(.nocv) .rc>p{justify-self:center;max-width:88%;padding:4px 0;text-align:center}
/* who and when: under the stars (two per row), or in the foot beside the listening apps (three per row) */

@media (max-width:520px){.rev{grid-template-columns:96px minmax(0,1fr)}.rl .cover{font-size:11px}.rrate .rv{font-size:12px}}
/* two or three reviews per row, wherever reviews are listed */
.list.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.list.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols2 .empty,.cols3 .empty{grid-column:1/-1}

.cols2 .sendw.open .tray,.cols3 .sendw.open .tray{transform:none}

.cols3 .rbf{display:flex}

.cols3 .rbf{display:none}
.cols3 .rf.np{display:none}

.cols3 .rev.nocv .rf.np{display:flex}

/* rating row under the artwork: picture | stars | number, picture and number the same width so the middle star sits on the artwork's centre line */
.rrate.wav{--rs:26px;justify-content:space-between;gap:8px}
.rrate.wav .stars{max-width:150px}
.rrate.wav .rv{width:var(--rs);text-align:center;font-size:14px}
.cols3 .rrate.wav{--rs:30px}
.cols3 .rrate.wav .rv{font-size:16px}
.cols2 .rrate.wav .rv{font-size:14px}
.rav{position:relative;flex:none;display:block;width:var(--rs);height:var(--rs);padding:0;border:0;background:none;border-radius:50%;line-height:0;cursor:pointer}
.rav .av{width:var(--rs);height:var(--rs)}
/* reviewer's name appears under their picture on hover */
.avbtn{position:relative}
.rav[data-name]:hover::after,.rav[data-name]:focus-visible::after,.avbtn[data-name]:hover::after,.avbtn[data-name]:focus-visible::after{content:attr(data-name);position:absolute;left:0;top:calc(100% + 5px);z-index:20;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 8px;border-radius:6px;background:var(--ink);color:var(--surface);font:500 12px/1.3 "Montserrat",sans-serif;letter-spacing:0;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.rbx{display:none}
.ear{display:none}
.tr{display:none}
.rbx .ownb{display:inline-flex;vertical-align:middle;margin-left:6px}
.ob{display:inline-grid;place-items:center;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:none;color:var(--mute);cursor:pointer;transition:color .12s,background .12s}
.ob:hover,.ob:focus-visible{color:var(--ink);background:var(--line)}
.rdel{margin-right:auto;color:var(--bad)}
/* two per row (wide screens): artwork half the card, platforms hanging down the top-right, the review in focus, actions in the bottom-right */
@media (min-width:701px){
.cols2 .rev:not(.nocv){grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px}
.cols2 .rev:not(.nocv) .rl .cover{font-size:14px}
.cols2 .rev:not(.nocv) .rbl{display:none}
.cols2 .rev:not(.nocv) .rf{display:none}

.cols2 .rev:not(.nocv) .ear{display:flex;flex-direction:column;align-items:center}
.cols2 .rev:not(.nocv) .rbx .ownb{display:none}
.cols2 .rev:not(.nocv) .rcf>.row{display:none}
/* stars and action buttons share the card's bottom line */
.cols2 .rev:not(.nocv) .rl{align-self:stretch}
.cols2 .rev:not(.nocv) .rl>.rrate{margin-top:auto}
/* two per row: artwork, stars and the tile's bottom edge are evenly spaced (the same 12px as the tile's padding) */
.cols2 .rev:not(.nocv) .rl{gap:12px}
/* and on the right: the same space between the date, the review and the buttons */
.cols2 .rev:not(.nocv) .rc{display:flex;flex-direction:column}
.cols2 .rev:not(.nocv) .rc>p{margin:auto 0;align-self:center}
.cols2 .rev:not(.nocv) .rcf{margin-top:auto}
.cols2 .rev:not(.nocv) .rc>p~.rcf{margin-top:0}
/* three per row: date (and your pen) under the artist; actions and apps share one line */
.cols3 .rev:not(.nocv) .rbx{display:none}
.cols3 .rev:not(.nocv) .rcf>.row{display:none}
.cols3 .rev:not(.nocv) .rbf{display:none}
.cols3 .rev:not(.nocv) .rcf{display:flex;flex-wrap:wrap;align-items:center}
.cols3 .rev:not(.nocv) .rcf>.acts{flex:1 1 auto}
.cols3 .rev:not(.nocv) .rcf>.rf{display:none}
.cols3 .rev:not(.nocv) .rcf>.cmts{flex-basis:100%}
/* three per row: title and artist centred like the review; the date sits in the bottom row, with the listen-on ear and your pen on the left (the ear's apps open out to the right, and the date steps aside while they're open) */
.cols3 .rev:not(.nocv) .rch{text-align:center}
.cols3 .rev:not(.nocv) .rbt{display:flex;align-items:center;gap:2px;flex-basis:100%;min-width:0;min-height:30px;padding-top:4px;margin-left:-4px}

.cols3 .rev:not(.nocv) .rbt .earc{margin:0;transform:rotate(-90deg)}
.cols3 .rev:not(.nocv) .rbt .ear.open .earc{transform:rotate(90deg)}

.cols3 .rev:not(.nocv) .rbt .beads::before{left:0;right:14px;top:50%;bottom:auto;width:auto;height:1px;transform:translateY(-50%)}
.cols3 .rev:not(.nocv) .rbt .bead{animation-name:beadx}

.cols3 .rev:not(.nocv) .rbt:has(.ear.open) .rbtd{display:none}
.cols2 .rev:not(.nocv) .rch{padding-right:30px}
.cols2 .rev:not(.nocv) .rch>h3{font-size:16px;line-height:1.25}
.cols2 .rev:not(.nocv) .rc>p{justify-self:center;max-width:100%;padding:6px 0;text-align:left;text-wrap:balance}
.cols2 .rev:not(.nocv) .rcf>.acts{margin:0 -5px 0 0;padding-top:0;justify-content:flex-end;gap:1px}
.cols2 .rev:not(.nocv) .act{padding:5px}
.cols2 .rev:not(.nocv) .act.later{margin-left:0}
}
/* sign-in page: a full-screen mosaic of review artwork; a couple of tiles turn over every second.
   The same tiles turn away when you sign in (revealing the app) and turn in when you sign out */
#amz{position:fixed;left:0;top:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
#amz.top{z-index:400}
#amz:not(.top)::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 38%,transparent)}
#amz .at{position:absolute;transform-style:preserve-3d;animation-fill-mode:both}
#amz .ai{position:absolute;inset:1px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1)}
#amz .af{position:absolute;inset:0;overflow:hidden;border-radius:3px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--g,var(--line))}
#amz .ab{transform:rotateY(180deg)}
#amz img{display:block;width:100%;height:100%;object-fit:cover;animation:afade .5s ease both}
#amz img.nf{animation:none}
@keyframes afade{from{opacity:0}}
#amz.go .at{animation-duration:.45s;animation-delay:var(--d,0ms)}
#amz.go.xw .at{animation-name:axw;animation-timing-function:ease-in}
#amz.go.xl .at{animation-name:axl;animation-timing-function:ease-in}
#amz.go.xr .at{animation-name:axr;animation-timing-function:ease-in}
#amz.go.xu .at{animation-name:axu;animation-timing-function:ease-in}
#amz.go.xd .at{animation-name:axd;animation-timing-function:ease-in}
#amz.go.nw .at{animation-name:anw;animation-timing-function:ease-out}
#amz.go.nl .at{animation-name:anl;animation-timing-function:ease-out}
#amz.go.nr .at{animation-name:anr;animation-timing-function:ease-out}
#amz.go.nu .at{animation-name:anu;animation-timing-function:ease-out}
#amz.go.nd .at{animation-name:aind;animation-timing-function:ease-out}
@keyframes axw{to{transform:perspective(600px) rotateX(90deg);visibility:hidden}}
@keyframes axl{to{transform:perspective(600px) rotateY(-90deg);visibility:hidden}}
@keyframes axr{to{transform:perspective(600px) rotateY(90deg);visibility:hidden}}
@keyframes axu{to{transform:perspective(600px) rotateX(90deg);visibility:hidden}}
@keyframes axd{to{transform:perspective(600px) rotateX(-90deg);visibility:hidden}}
@keyframes anw{from{transform:perspective(600px) rotateX(-90deg);visibility:hidden}to{transform:perspective(600px) rotateX(0)}}
@keyframes anl{from{transform:perspective(600px) rotateY(90deg);visibility:hidden}to{transform:perspective(600px) rotateY(0)}}
@keyframes anr{from{transform:perspective(600px) rotateY(-90deg);visibility:hidden}to{transform:perspective(600px) rotateY(0)}}
@keyframes anu{from{transform:perspective(600px) rotateX(-90deg);visibility:hidden}to{transform:perspective(600px) rotateX(0)}}
@keyframes aind{from{transform:perspective(600px) rotateX(90deg);visibility:hidden}to{transform:perspective(600px) rotateX(0)}}
/* sign in / sign out: plain tiles flip away in a wave and the next screen shows through */
#wave{position:fixed;inset:0;z-index:300;display:grid;pointer-events:none;overflow:hidden;contain:strict}
#wave i{display:block;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line);animation:wv .3s ease-in var(--d,0ms) both}
/* the M transition: every tile turns at once, each its own way; the tiles forming a big M wait a second, darkened and lifted */
#mflip{position:fixed;left:0;top:0;z-index:301;pointer-events:none;contain:strict}
#mflip .mf{position:absolute;transform-style:preserve-3d;animation-duration:.7s;animation-timing-function:cubic-bezier(.5,0,.3,1);animation-fill-mode:both;animation-play-state:paused}
#mflip.l .mf{animation-name:mfl}
#mflip.r .mf{animation-name:mfr}
#mflip.u .mf{animation-name:mfu}
#mflip.d .mf{animation-name:mfd}
#mflip .mf.m{z-index:2;animation-duration:.7s,1s;animation-delay:1s,0s;animation-timing-function:cubic-bezier(.5,0,.3,1),linear}
#mflip.l .mf.m{animation-name:mfl,mlift}
#mflip.r .mf.m{animation-name:mfr,mlift}
#mflip.u .mf.m{animation-name:mfu,mlift}
#mflip.d .mf.m{animation-name:mfd,mlift}
#mflip.go .mf{animation-play-state:running}
#mflip canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#mflip.h .k{transform:rotateY(180deg)}
#mflip.v .k{transform:rotateX(180deg)}
#mflip .m .f{animation:mdim 1s linear both paused}
#mflip.go .m .f{animation-play-state:running}
@keyframes mlift{0%{box-shadow:0 0 0 rgba(0,0,0,0)}12%,88%{box-shadow:0 10px 24px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 rgba(0,0,0,0)}}
@keyframes mdim{0%{filter:brightness(1)}12%,100%{filter:brightness(.78)}}
@keyframes mfl{from{transform:perspective(700px) rotateY(0)}to{transform:perspective(700px) rotateY(-180deg)}}
@keyframes mfr{from{transform:perspective(700px) rotateY(0)}to{transform:perspective(700px) rotateY(180deg)}}
@keyframes mfu{from{transform:perspective(700px) rotateX(0)}to{transform:perspective(700px) rotateX(180deg)}}
@keyframes mfd{from{transform:perspective(700px) rotateX(0)}to{transform:perspective(700px) rotateX(-180deg)}}
#wave.mw i{animation-duration:.5s;animation-timing-function:ease-in;animation-delay:var(--d,0ms);animation-fill-mode:both}
#wave.mw i.wl{animation-name:wl}
#wave.mw i.wr{animation-name:wr}
#wave.mw i.wu{animation-name:wu}
#wave.mw i.wd{animation-name:wd}
#wave.mw i.wm{position:relative;z-index:1;box-shadow:inset 0 0 0 .5px var(--line),0 8px 20px rgba(0,0,0,.3)}
@keyframes wl{0%{transform:perspective(500px) rotateY(0);visibility:visible}99%{visibility:visible}100%{transform:perspective(500px) rotateY(-90deg);visibility:hidden}}
@keyframes wr{0%{transform:perspective(500px) rotateY(0);visibility:visible}99%{visibility:visible}100%{transform:perspective(500px) rotateY(90deg);visibility:hidden}}
@keyframes wu{0%{transform:perspective(500px) rotateX(0);visibility:visible}99%{visibility:visible}100%{transform:perspective(500px) rotateX(90deg);visibility:hidden}}
@keyframes wd{0%{transform:perspective(500px) rotateX(0);visibility:visible}99%{visibility:visible}100%{transform:perspective(500px) rotateX(-90deg);visibility:hidden}}
@keyframes wv{0%{transform:perspective(500px) rotateX(0);visibility:visible}99%{visibility:visible}100%{transform:perspective(500px) rotateX(90deg);visibility:hidden}}
@media (prefers-reduced-motion:reduce){#wave{display:none}}
#tflip{position:fixed;left:0;top:0;z-index:300;display:block;touch-action:none}
@media (prefers-reduced-motion:reduce){#tflip{display:none}}

function dmChanged(){var inc=DMIN;DMIN=null;
if(S.tab==="msgs"&&$(".dmp")){dmSeen();dmPaint()}
else if(inc&&document.visibilityState==="visible")toast("New message from "+inc.from);
dmBadge()}
function dmSeen(){var w=S.dmWith;if(!w||S.tab!=="msgs"||S.dmNew||document.visibilityState!=="visible")return;var any=false;
S.dm.forEach(function(x){if(x.from===w&&x.to===S.user&&!x.read){x.read=true;any=true}});
if(any){Promise.resolve(api.dmRead(w)).catch(function(){});var ls=$("#dmlist");if(ls)ls.innerHTML=dmListHTML();dmBadge()}}
function dmBadge(){var n=S.user?dmUnread():0,b=$("#mb");
if(b){var c=b.querySelector(".mbn");if(n){if(!c){c=document.createElement("i");c.className="mbn";c.setAttribute("aria-hidden","true");b.appendChild(c)}c.textContent=n>9?"9+":String(n)}else if(c)c.remove();b.setAttribute("aria-label","Messages"+(n?", "+n+" unread":""))}
try{document.title=(n?"("+n+") ":"")+TITLE}catch(e){}}
function dmPaint(bottom){var ls=$("#dmlist");if(ls)ls.innerHTML=dmListHTML();
var box=$("#dmmsgs");if(box&&S.dmWith){var end=bottom||box.scrollHeight-box.scrollTop-box.clientHeight<90,top=box.scrollTop;box.innerHTML=dmThreadHTML(S.dmWith);box.scrollTop=end?box.scrollHeight:top}
dmBadge()}
/* send text, or a review by id: it shows straight away, then is confirmed, or marked "couldn't send" with a retry
   (quiet: on failure just drop it, for the share tray, which says so itself) */
function dmSend(to,body,rid,quiet){body=String(body||"").trim().slice(0,1000);if(!S.user||!to||to===S.user||(!body&&rid==null))return Promise.resolve(false);
var p=dmMk("p"+(++DMSEQ),S.user,to,body,rid,new Date().toISOString(),false);p.pend=true;S.dmPend.push(p);
if(S.tab==="msgs")dmPaint(true);
function fail(){if(quiet)S.dmPend=S.dmPend.filter(function(x){return x!==p});else{p.pend=false;p.fail=true}if(S.tab==="msgs")dmPaint();return false}
return Promise.resolve(api.dmSend(to,body||null,rid)).then(function(res){if(!(res&&res.msg))return fail();
S.dmPend=S.dmPend.filter(function(x){return x!==p});dmMerge([res.msg],true);if(S.tab==="msgs")dmPaint();else dmBadge();return true},fail)}
function dmUnsendMsg(id){var m=S.dm.filter(function(x){return String(x.id)===String(id)})[0];if(!m||m.from!==S.user)return;
if(!confirm("Unsend this message? It’ll disappear for both of you."))return;
dmGone(m.id);dmPaint();
function undo(){dmMerge([m],true);dmPaint();toast("Couldn’t unsend it. Try again.")}
Promise.resolve(api.dmUnsend(m.id)).then(function(r){if(r&&r.error)undo()},undo)}
/* the backstop poll: quick while you're on Messages, slow elsewhere, slower still when live delivery is working */
function dmTick(){if(!S.user||!S.msgOK||DMBUSY||document.visibilityState!=="visible")return;
var on=S.tab==="msgs",gap=on?(S.dmLive?12000:4000):(S.dmLive?120000:40000);if(Date.now()-DMLAST<gap)return;
DMBUSY=1;DMLAST=Date.now();Promise.resolve(api.dmPoll()).then(function(ch){DMBUSY=0;if(ch)dmChanged()},function(){DMBUSY=0})}
setInterval(dmTick,2000);
/* back on the tab: catch up on messages (live delivery can drop while a phone sleeps); after a minute away the full quiet refresh does it */
document.addEventListener("visibilitychange",function(){if(document.visibilityState!=="visible"||!S.user)return;dmSeen();if(REMOTE&&Date.now()-(S.loadedAt||0)>=60000)return;DMLAST=0;dmTick()});
window.addEventListener("resize",function(){if(S.tab==="msgs")dmFit()});
/* this browser's messages, for the preview (no database) */
function dmStore(){var l=store.get("ln_msgs",null);
if(!Array.isArray(l)){l=[];accts.forEach(function(a){(a.msgs||[]).forEach(function(m){if(m&&m.by)l.push({id:m.id||Date.now()+l.length,from:m.by,to:a.name,body:"",rid:m.rid,at:(okDate(m.date)||new Date().toISOString().slice(0,10))+"T12:00:00.000Z",read:!!m.read})})});store.set("ln_msgs",l)}
return l.filter(function(x){return x&&x.from&&x.to}).map(function(x){return dmMk(x.id,x.from,x.to,x.body,x.rid,x.at,x.read)})}
function dmSave(l){store.set("ln_msgs",l.slice(-2000).map(function(x){return {id:x.id,from:x.from,to:x.to,body:x.body,rid:x.rid,at:x.at,read:x.read}}))}
function syncDm(){S.dm=S.user?dmStore().filter(function(x){return x.from===S.user||x.to===S.user}).sort(dmCmp):[]}
function dmReset(){dmLiveStop();S.dm=[];S.dmPend=[];S.dmWith=null;S.dmNew=false;S.dmDraft={};DMLAST=0;DMIN=null;try{document.title=TITLE}catch(e){}}
/* times: "now", "5m", "3h", "Tue", "12 Nov"; in a chat, day breaks ("Today", "Yesterday", "Tuesday") and 24-hour clock times */
function dmDay(t){var d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
function dmClock(t){try{return new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function dmDayLabel(t){var d=new Date(t),n=new Date(),y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);
if(dmDay(t)===dmDay(n.getTime()))return "Today";if(dmDay(t)===dmDay(y.getTime()))return "Yesterday";
var o=n-d<6*864e5?{weekday:"long"}:d.getFullYear()===n.getFullYear()?{weekday:"short",day:"numeric",month:"short"}:{day:"numeric",month:"short",year:"numeric"};
try{return d.toLocaleDateString("en-GB",o)}catch(e){return d.toDateString()}}
function dmAgo(t){var g=Date.now()-t;if(g<6e4)return "now";if(g<36e5)return Math.floor(g/6e4)+"m";if(g<864e5)return Math.floor(g/36e5)+"h";
var d=new Date(t),n=new Date(),o=g<6*864e5?{weekday:"short"}:d.getFullYear()===n.getFullYear()?{day:"numeric",month:"short"}:{day:"numeric",month:"short",year:"2-digit"};
try{return d.toLocaleDateString("en-GB",o)}catch(e){return ""}}
/* message text: escaped, links clickable, line breaks kept */
function dmText(t){t=String(t||"");var out="",re=/https?:\/\/[^\s<>"']+/g,i=0,m;
while((m=re.exec(t))){var u=m[0].replace(/[.,:;!?)\]]+$/,"");out+=esc(t.slice(i,m.index))+'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer nofollow">'+esc(u)+'</a>';i=m.index+u.length;re.lastIndex=i}
return (out+esc(t.slice(i))).replace(/\n/g,"<br>")}
/* a shared review, as a little card (tap it for the song's page) */
function dmRevHTML(x){var r=revOf(x.rid);if(!r)return '<div class="dmb dmgone">This review was deleted.</div>';
return '<button type="button" class="dmrv" data-dminfo="rv:'+esc(r.id)+'" aria-label="'+esc(r.user)+'’s review of '+esc(r.title)+' by '+esc(r.artist)+'">'+rimg({title:r.title,artist:r.artist,thumb:r.art})+
'<span class="dmrvb"><b>'+esc(r.title)+'</b><span class="dmrva">'+esc(r.artist)+'</span><span class="dmrvr">'+STAR1+rnum(r.rating).toFixed(1)+'<span class="meta"> · '+esc(r.user)+'</span></span>'+(r.text?'<span class="dmrvt">“'+esc(r.text)+'”</span>':'')+'</span></button>'}
function dmListHTML(){var th=dmThreads();if(!th.length)return '<p class="meta dmnone">No conversations yet.</p>';
return th.map(function(t){var x=t.last,mine=x.from===S.user,r=x.rid!=null?revOf(x.rid):null,
pv=x.fail?"Couldn’t send":x.pend?"Sending…":x.rid!=null?(mine?"You shared ":"Shared ")+(r?"“"+r.title+"”":"a review"):(mine?"You: ":"")+x.body.replace(/\s+/g," ");
return '<button type="button" class="dmi'+(t.u===S.dmWith?' on':'')+(t.un?' un':'')+'" data-dmw="'+esc(t.u)+'"'+(t.u===S.dmWith?' aria-current="true"':'')+'>'+avatar(acct(t.u))+
'<span class="dmin"><b>'+esc(t.u)+'</b><span class="dmpv">'+esc(pv)+'</span></span><span class="dmr"><span>'+esc(dmAgo(x.t))+'</span>'+(t.un?'<i class="dmn" aria-label="'+t.un+' unread">'+(t.un>9?"9+":t.un)+'</i>':'')+'</span></button>'}).join("")}
/* who you can message: people you follow or who follow you first, then everyone else */
function dmPeopleHTML(q){q=String(q||"").trim().toLowerCase();var l=friends().slice();
accts.forEach(function(a){if(a.name!==S.user&&l.indexOf(a.name)<0)l.push(a.name)});
if(q)l=l.filter(function(n){return n.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return (a.toLowerCase().indexOf(q)?1:0)-(b.toLowerCase().indexOf(q)?1:0)});
l=l.slice(0,40);if(!l.length)return '<p class="meta dmnone">'+(q?'No one called “'+esc(q)+'”.':'No one to message yet.')+'</p>';
return l.map(function(n){var a=acct(n),f=isFol(n),b=!!a&&(a.following||[]).indexOf(S.user)>-1;
return '<button type="button" class="dmi" data-dmw="'+esc(n)+'">'+avatar(a)+'<span class="dmin"><b>'+esc(n)+'</b><span class="dmpv">'+(f&&b?"You follow each other":f?"You follow them":b?"Follows you":"")+'</span></span></button>'}).join("")}
/* one chat: day breaks, runs of messages grouped (same person, a few minutes apart), their avatar by each run, and "Seen" */
function dmThreadHTML(u){var ua=acct(u),l=dmAll().filter(function(x){return (x.from===u&&x.to===S.user)||(x.from===S.user&&x.to===u)});
if(!l.length)return '<div class="dmhi">'+avatar(ua,"big")+'<b>'+esc(u)+'</b><span class="meta">No messages yet. Say hi, or send them a review from its share button.</span></div>';
var h="",day="",g=null;function shut(){if(g){h+='</div></div>';g=null}}
l.forEach(function(x){var k=dmDay(x.t),mine=x.from===S.user;
if(k!==day){shut();h+='<div class="dmday">'+esc(dmDayLabel(x.t))+'</div>';day=k}
if(!g||g.mine!==mine||x.t-g.t>3e5){shut();g={mine:mine};h+='<div class="dmg '+(mine?'mine':'their')+'">'+(mine?'':'<span class="dmav">'+avatar(ua,"xs")+'</span>')+'<div class="dmgs">'}
g.t=x.t;
h+='<div class="dmm'+(x.pend?' pend':'')+(x.fail?' fail':'')+'" data-dmsel="1">'+(x.rid!=null?dmRevHTML(x):'<div class="dmb">'+dmText(x.body)+'</div>')+
(x.fail?'<button type="button" class="dmre" data-dmre="'+esc(x.id)+'">Couldn’t send. Tap to retry</button>':'<span class="dmtm">'+esc(dmClock(x.t))+(mine&&!x.pend?' · <button type="button" class="dmun" data-dmun="'+esc(x.id)+'">Unsend</button>':'')+'</span>')+'</div>'});
shut();var z=l[l.length-1];if(z.from===S.user&&!z.fail)h+='<div class="dmst">'+(z.pend?"Sending…":z.read?"Seen":"Sent")+'</div>';
return h}
function dmView(){var w=S.dmWith,wa=w&&acct(w);if(w&&!wa)S.dmWith=w=null;
var h='<section class="dmp'+(w?' dmo':'')+'" aria-label="Messages"><div class="dml">';
if(S.dmNew)h+='<div class="dmlh"><h2>New message</h2><button type="button" class="ib" data-dmcancel="1" aria-label="Cancel new message" title="Cancel">'+DMI.x+'</button></div>'+
'<div class="dmto"><label for="dmq">To</label><input id="dmq" type="search" placeholder="Search people" autocomplete="off" spellcheck="false"></div><div class="dmlist" id="dmpl">'+dmPeopleHTML("")+'</div>';
else h+='<div class="dmlh"><h2>Messages</h2><button type="button" class="ib" data-dmnew="1" aria-label="New message" title="New message">'+DMI.pen+'</button></div><div class="dmlist" id="dmlist">'+dmListHTML()+'</div>';
h+='</div><div class="dmt">';
if(wa)h+='<div class="dmth"><button type="button" class="ib dmback" data-dmback="1" aria-label="Back to your messages">'+DMI.back+'</button><button type="button" class="dmwho" data-dmu="'+esc(w)+'" title="'+esc(w)+'’s profile">'+avatar(wa)+'<b>'+esc(w)+'</b></button></div>'+
'<div class="dmmsgs" id="dmmsgs" role="log" aria-live="polite" aria-label="Chat with '+esc(w)+'">'+dmThreadHTML(w)+'</div>'+
'<form class="dmf" id="dmf" autocomplete="off"><textarea id="dmx" rows="1" maxlength="1000" placeholder="Message '+esc(w)+'…" aria-label="Message '+esc(w)+'"></textarea><button type="submit" class="dmsend" id="dmsend" aria-label="Send" title="Send" disabled>'+DMI.send+'</button></form>';
else h+='<div class="dmempty"><div>'+DMI.big+'<p><b>Your messages</b></p><p class="meta">Chat with anyone on Mosaic, and send them reviews from any review’s share button.</p><button type="button" class="btn ink sm" data-dmnew="1">New message</button></div></div>';
return h+'</div></section>'}
function dmCoarse(){try{return matchMedia("(pointer:coarse)").matches}catch(e){return false}}
function dmWide(){try{return matchMedia("(min-width:701px)").matches}catch(e){return true}}
/* the chat fills the screen below the header, so the messages scroll inside it and the box stays at the bottom */
function dmFit(){var p=$(".dmp");if(!p)return;var top=p.getBoundingClientRect().top+(window.scrollY||0);p.style.height=Math.max(360,Math.round(window.innerHeight-top-14))+"px"}
function dmOpen(u){S.tab="msgs";S.q="";S.stack=[];S.dmNew=false;if(u!==undefined)S.dmWith=u;S.shut=keepShut();appView();try{window.scrollTo(0,0)}catch(e){}}
function dmBtn(n){return S.user&&S.msgOK&&n!==S.user?'<button type="button" class="dmto1" data-dmto="'+esc(n)+'" aria-label="Message '+esc(n)+'" title="Message '+esc(n)+'">'+DMI.chat+'</button>':''}
function dmClick(e){var t=e.target,b;if(!t||!t.closest)return;
if((b=t.closest("[data-dminfo]"))){openSong(songOf(b.dataset.dminfo));return}
if((b=t.closest("[data-dmun]"))){dmUnsendMsg(b.dataset.dmun);return}
if((b=t.closest("[data-dmre]"))){var p=S.dmPend.filter(function(x){return String(x.id)===b.dataset.dmre})[0];if(p){S.dmPend=S.dmPend.filter(function(x){return x!==p});dmSend(p.to,p.body,p.rid)}return}
if((b=t.closest("[data-dmw]"))){S.dmWith=b.dataset.dmw;S.dmNew=false;appView();return}
if((b=t.closest("[data-dmnew]"))){S.dmNew=true;appView();return}
if((b=t.closest("[data-dmcancel]"))){S.dmNew=false;appView();return}
if((b=t.closest("[data-dmback]"))){S.dmWith=null;appView();return}
if((b=t.closest("[data-dmu]"))){var u=b.dataset.dmu;S.view=u;S.tab=u===S.user?"profile":"user";S.stack=[];S.shut=keepShut();appView();try{window.scrollTo(0,0)}catch(er){}return}
if(t.closest("a,button,textarea,input"))return;
if((b=t.closest("[data-dmsel]"))){var was=b.classList.contains("sel");[].forEach.call(document.querySelectorAll(".dmm.sel"),function(x){x.classList.remove("sel")});if(!was)b.classList.add("sel")}}
function dmWire(){dmBadge();var p=$(".dmp");if(!p)return;dmFit();p.onclick=dmClick;
var box=$("#dmmsgs");if(box)box.scrollTop=box.scrollHeight;
var f=$("#dmf"),x=$("#dmx"),sd=$("#dmsend"),w=S.dmWith;
if(f&&x&&sd){var grow=function(){x.style.height="";x.style.height=Math.min(Math.max(x.scrollHeight+2,42),132)+"px";sd.disabled=!x.value.trim()},
go=function(){var v=x.value.trim();if(!v)return;S.dmDraft[w]="";x.value="";grow();dmSend(w,v,null)};
x.value=S.dmDraft[w]||"";grow();
x.oninput=function(){S.dmDraft[w]=x.value;grow()};
x.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229&&!dmCoarse()){e.preventDefault();go()}};
sd.onpointerdown=function(e){e.preventDefault()};
f.onsubmit=function(e){e.preventDefault();go()};
if(!dmCoarse())try{x.focus({preventScroll:true})}catch(e){}}
var q=$("#dmq"),pl=$("#dmpl");if(q&&pl){q.oninput=function(){pl.innerHTML=dmPeopleHTML(q.value)};
q.onkeydown=function(e){if(e.key==="Escape"){S.dmNew=false;appView()}else if(e.key==="Enter"){e.preventDefault();var o=pl.querySelector("[data-dmw]");if(o)o.click()}};
if(!dmCoarse())try{q.focus({preventScroll:true})}catch(e){}}
dmSeen();dmBadge()}

var api=REMOTE?remoteApi:localApi;
/* nothing refetches while you're using the site; when you come back to the tab after a minute or more, everything refreshes
   quietly in the background, and the page only redraws if something changed (and you're not mid-way through typing) */
var BGR=0;
function dataSig(){var a=me();return JSON.stringify([S.reviews.map(function(r){return [r.id,r.rating,r.text]}),accts.map(function(x){return [x.name,x.pic?x.pic.length:0,(x.following||[]).length]}),
[S.likes,S.reposts,S.comments].map(function(o){return Object.keys(o).map(function(k){return k+":"+o[k].length}).join()}),
a&&a.notes?a.notes.filter(function(n){return !n.read}).length:0,dmSig(),S.sotdOK?sdSig():""])}
function bgRefresh(){if(!REMOTE||!S.user||BGR||Date.now()-(S.loadedAt||0)<60000)return;BGR=1;var before=dataSig();
api.refresh().then(function(){BGR=0;if(!S.user||dataSig()===before)return;var ae=document.activeElement,dl=$("#dlg");
if((dl&&dl.open)||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))return;var y=window.scrollY;appView();try{window.scrollTo(0,y)}catch(e){}}).catch(function(){BGR=0})}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")bgRefresh()});
window.addEventListener("pageshow",function(e){if(e.persisted)bgRefresh()});
if(REMOTE)$("#app").innerHTML='<p class="meta" style="padding:24px">Loading…</p>';
api.start().then(function(ok){if(ok)appView();else authView()}).catch(function(){$("#app").innerHTML='<p class="meta" style="padding:24px">Couldn\'t connect to the database. Refresh the page to try again.</p>'});
})();
</script>
